<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>27th HYSTA Annual Conference Lottery</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <header class="conference-banner" aria-label="27th HYSTA Annual Conference VIP Gala">
      <img src="assets/HYSTA.jpg" alt="27th Annual Conference VIP Gala" class="hero-image">
    </header>

    <section class="lottery-panel">
      <div class="title-row">
        <img class="laurel-img left" src="assets/laurel-left.png" alt="">
        <h1><span class="trophy">🏆</span> 27th HYSTA Annual Conference<br class="title-break"> Lottery Winners</h1>
        <img class="laurel-img right" src="assets/laurel-left.png" alt="">
      </div>
      <div class="gold-divider"><span>★</span></div>

      <div class="controls">
        <button id="lotteryBtn" class="lottery-btn">Start Lottery <span class="arrow">→</span></button>
      </div>

      <div id="currentDisplay" class="current-display">
        <span class="placeholder">Click “Start Lottery” to begin!</span>
      </div>

      <div id="winnersDisplay" class="winners-display">
        <span class="placeholder winners-placeholder">Winners will appear here...</span>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
